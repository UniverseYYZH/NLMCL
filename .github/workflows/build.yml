name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 公开镜像不包含 PCL 适配层，只构建可公开的领域层。
      - name: Restore public solution
        run: dotnet restore NLMCL.Public.sln

      - name: Build public solution
        run: dotnet build NLMCL.Public.sln -c Debug --no-restore -nologo -m:1
