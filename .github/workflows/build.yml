name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NLMCL.sln

      # -m:1：并行构建偶发 MSBuild 的 ResolvePackageFileConflicts NRE
      - name: Build
        run: dotnet build NLMCL.sln -c Debug --no-restore -nologo -m:1

      - name: Locate xunit console runner
        shell: pwsh
        run: |
          $runner = Get-ChildItem "$env:USERPROFILE\.nuget\packages\xunit.runner.console\*\tools\net472\xunit.console.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $runner) { throw "xunit.console.exe 未找到，检查 NuGet 还原是否成功" }
          "XUNIT_RUNNER=$($runner.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # net48 + SDK 风格项目下 VSTest 适配器会加载失败，必须用控制台 runner
      - name: Test
        shell: pwsh
        run: |
          & "$env:XUNIT_RUNNER" "tests\NLMCL.Tests\bin\Debug\net48\NLMCL.Tests.dll" -nologo -parallel none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
